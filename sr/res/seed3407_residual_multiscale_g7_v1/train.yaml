# G7：保留 G0 descriptor 主路径，增加带小门控的 conv2/conv3 多尺度残差。
MODEL:
  model_variant: vessel_masked_residual_multiscale
  nms_size: 10
  nms_thresh: 0.1
  batch_size: 4
  num_epoch: 150
  seed: 3407
  deterministic: true
  num_workers: 8
  device: cuda:1
  load_pre_trained_model: false
  pretrained_path: null
  resume_optimizer: false
  model_save_path: /home/data1/zhangjunhong/sr_project/sr/res/seed3407_residual_multiscale_g7_v1/model_149.pth
  model_save_epoch: 1
  checkpoint_save_epochs: [49, 99, 149]
